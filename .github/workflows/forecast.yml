name: Scheduled forecast pipeline
# Ingests primary sources and rebuilds the forecast against the production
# database. Requires the DATABASE_URL GitHub secret (managed PostgreSQL, e.g. Neon
# or Vercel Postgres). Optional: FEC_API_KEY secret for campaign finance,
# DATAVERSE_API_KEY secret for the guestbook-gated MEDSL House returns file
# (see app/ingest/medsl.py docstring for the one-time account setup),
# POLLS_FEED_URL repository variable for a live 2026 polling feed
# (any CSV in the FiveThirtyEight raw-polls schema).
on:
  # Prediction-code merges must rebuild the production database immediately;
  # a Vercel redeploy alone only updates the serving layer.
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/forecast.yml'
  # Hourly wake-up; scripts/should_refresh.py gates this to daily / 6h / 3h /
  # 2h as Election Day approaches. This keeps one auditable workflow while
  # avoiding needless API calls early in the cycle.
  schedule: [{cron: '17 * * * *'}]
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # The GitHub secret keeps the name DATABASE_URL; the app code reads
      # DATEBASE_URL (see app/db.py), so it's remapped here.
      DATEBASE_URL: ${{ secrets.DATABASE_URL }}
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      DATAVERSE_API_KEY: ${{ secrets.DATAVERSE_API_KEY }}
      POLLS_FEED_URL: ${{ vars.POLLS_FEED_URL }}
      CANDIDATE_PROFILES_URL: ${{ vars.CANDIDATE_PROFILES_URL }}
      CAMPAIGN_EVENTS_URL: ${{ vars.CAMPAIGN_EVENTS_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine adaptive refresh cadence
        id: cadence
        run: python scripts/should_refresh.py
      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.run == 'true'
        with: {python-version: '3.12'}
      - if: steps.cadence.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Require production database
        if: steps.cadence.outputs.run == 'true'
        run: |
          if [ -z "$DATEBASE_URL" ]; then
            echo "::warning::DATABASE_URL secret not configured; skipping live refresh."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Ingest primary sources
        if: steps.cadence.outputs.run == 'true' && env.SKIP != '1'
        run: python scripts/ingest.py --sources fte_polls,legislators,medsl,fec,votehub,polls_feed,candidate_profiles,campaign_events
      - name: Build frequent forecast and control simulation
        if: steps.cadence.outputs.run == 'true' && steps.cadence.outputs.full_backtest != 'true' && env.SKIP != '1'
        run: python scripts/forecast.py --skip-backtests
      - name: Build forecast with full validation backtests
        if: steps.cadence.outputs.run == 'true' && steps.cadence.outputs.full_backtest == 'true' && env.SKIP != '1'
        run: python scripts/forecast.py
